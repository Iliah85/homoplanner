/* ========== Media previews (blobs live in IndexedDB) ========== */
async function hydrateMedia(root) {
  for (const slot of $$('.media-slot[data-file]', root)) {
    if (slot.dataset.done) continue; slot.dataset.done = '1';
    const id = slot.dataset.file, mime = slot.dataset.mime || '';
    try {
      let url = await fileUrl(id);
      if (!url && SYNC.cfg) { slot.innerHTML = '<span class="small muted">در حال گرفتن از ابر…</span>'; try { url = await syncFetchMedia(id, mime); } catch (e) { /* offline: offer re-upload below */ } }
      if (!url) { slot.innerHTML = `<div class="media-missing"><span>${icon('warn')} خود فایل اینجا نیست</span><label class="btn sm no-print" style="cursor:pointer">${icon('upload')} دوباره آپلودش کن<input type="file" class="sr" data-nokeep data-ch="work.reup" data-id="${esc(id)}" accept="image/*,audio/*,video/*,application/pdf"></label></div>`; continue; }
      if (mime.startsWith('image/')) slot.innerHTML = `<img src="${url}" alt="" data-zoom="1">`;
      else if (mime.startsWith('audio/')) slot.innerHTML = `<audio controls src="${url}"></audio>`;
      else if (mime.startsWith('video/')) slot.innerHTML = `<video controls src="${url}"></video>`;
      else slot.innerHTML = `<a class="btn sm" href="${url}" target="_blank" rel="noopener">${icon('file')} باز کردن فایل</a>`;
    } catch (e) { slot.textContent = 'فایل بارگذاری نشد.'; }
  }
}

/* Charts: hand-rolled SVG, one scale per chart */
function barChart(data, color) {
  const W = 520, H = 190, L = 40, B = 24, T = 10, max = Math.max(60, ...data.map(d => d.v)), step = max > 600 ? 300 : max > 240 ? 120 : 60, top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top), bw = (W - L) / data.length;
  let g = ''; for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--rule)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fa(v / 60)}س</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار زمان">${g}${data.map((d, i) => `<rect x="${L + i * bw + bw * .2}" y="${y(d.v)}" width="${bw * .6}" height="${Math.max(0, H - B - y(d.v))}" style="fill:${color}"><title>${esc(d.l)}: ${fmtMin(d.v)}</title></rect><text x="${L + i * bw + bw / 2}" y="${H - 7}" text-anchor="middle">${esc(d.l)}</text>`).join('')}</svg>`;
}
function lineChart(data, color) {
  const W = 520, H = 170, L = 40, B = 24, T = 10, max = Math.max(30, ...data.map(d => d.v)), step = max > 300 ? 120 : max > 120 ? 60 : 30, top = Math.ceil(max / step) * step;
  const x = i => L + (W - L - 8) * (i / (data.length - 1 || 1)), y = v => T + (H - T - B) * (1 - v / top);
  const pts = data.map((d, i) => `${x(i)},${y(d.v)}`).join(' ');
  let g = ''; for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--rule)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fa(v)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="روند روزانه">${g}<polygon points="${x(0)},${y(0)} ${pts} ${x(data.length - 1)},${y(0)}" style="fill:${color};opacity:.16"/><polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="2.4" stroke-linejoin="round"/>${data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.v)}" r="${i === data.length - 1 ? 4.2 : 2.3}" style="fill:${color}"><title>${esc(d.l)}: ${fmtMin(d.v)}</title></circle>${i % 3 === 1 ? `<text x="${x(i)}" y="${H - 7}" text-anchor="middle">${esc(d.l)}</text>` : ''}`).join('')}</svg>`;
}
function donut(data) {
  const total = data.reduce((a, d) => a + d.v, 0); if (!total) return `<p class="hint">هنوز زمانی ثبت نشده.</p>`;

const txTotals = l => { let income = 0, expense = 0; l.forEach(t => { if (t.type === 'income') income += t.amount; else expense += t.amount; }); return { income, expense, balance: income - expense }; };
const parseTags = s => Array.from(new Set(String(s || '').split(/[\s,،]+/).map(p => p.trim()).filter(Boolean).map(p => '#' + p.replace(/^#+/, '')).filter(p => p.length > 1)));

function moneyCoach(month, today, m) {
  const all = D.finance.transactions; if (!all.length) return ['هنوز چیزی ثبت نکردی. از همین امروز خرج و دخلت رو با هشتگ بنویس تا الگوها معلوم بشن.'];
  const lines = [], budget = D.finance.monthlyBudget;
  if (budget) { const p = Math.round(m.expense / budget * 100); lines.push(p >= 100 ? `بودجه‌ی ماه تموم شده (${fa(p)}٪). تا اول ماه بعد روی خرج‌های غیرضروری سخت بگیر.` : p >= 80 ? `${fa(p)}٪ بودجه‌ی ماه مصرف شده؛ نزدیک سقفی. خرج‌های بزرگ رو عقب بنداز.` : p >= 50 ? `${fa(p)}٪ بودجه‌ی ماه مصرف شده. هنوز جا داری.` : `بودجه‌ی ماه آرومه (${fa(p)}٪ مصرف).`); }
  else lines.push('یه سقف ماهانه بذار تا تحلیل دقیق‌تر بشه.');
  const tagMap = {}; all.filter(t => jKey(t.date) === month && t.type === 'expense').forEach(t => (t.tags.length ? t.tags : ['#بدون‌برچسب']).forEach(x => { tagMap[x] = (tagMap[x] || 0) + t.amount; }));
  const top = Object.entries(tagMap).sort((a, b) => b[1] - a[1])[0];
  if (top && m.expense) { const sh = Math.round(top[1] / m.expense * 100); lines.push(`بیشترین خرج ماه: ${top[0]} با ${fa(sh)}٪.${sh >= 40 ? ' این هفته محدودش کن.' : ''}`); }
  if (m.income === 0 && m.expense > 0) lines.push('این ماه فقط خرج ثبت شده؛ اگه درآمدی داشتی با نوع «دخل» ثبتش کن.');

/* ========== Cloud sync through a private GitHub repository ==========
   Local-first: the notebook always works from this device's IndexedDB; the cloud is only a meeting point.
   Each device keeps the last version it agreed on with the cloud (the base), so a sync is a three-way merge:
   a row changed on one side wins, rows changed on both sides merge field by field, and only a field changed
   on both sides falls back to the newest edit. No per-mutation change tracking is needed.
   Repo layout: core.json, notes.json, tasks/YYYY-MM.json, blocks/YYYY-MM.json, blobs/<hash>.<mime>, media/<id>, hp.json */
const SYNC = { cfg: null, state: 'off', msg: '', last: 0, timer: 0, run: null, again: false, key: null, images: new Map(), noteMemo: new Map() };
const syncErr = (kind, msg, status) => Object.assign(new Error(msg || kind), { kind, status });
const API_BASE = () => (SYNC.cfg && SYNC.cfg.api) || 'https://api.github.com';

async function gh(path, opts = {}) {
  const c = SYNC.cfg;
  const url = path.startsWith('/repos/') ? API_BASE() + path : `${API_BASE()}/repos/${c.owner}/${c.repo}${path}`;
  const headers = { Authorization: `Bearer ${c.token}`, Accept: opts.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (opts.body) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(url, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' }); }
  catch (e) { throw syncErr('offline', 'network'); }
  if (!r.ok) throw syncErr(r.status === 401 ? 'auth' : r.status === 403 ? 'denied' : r.status === 404 ? 'missing' : 'http', 'http ' + r.status, r.status);
  if (opts.raw) return new Uint8Array(await r.arrayBuffer());
  return r.status === 204 ? null : r.json();
}

/* ---------- bytes + optional passphrase encryption ---------- */
const utf8 = s => new TextEncoder().encode(s), unutf8 = b => new TextDecoder().decode(b);
function bytesB64(u) { let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
function b64Bytes(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function deriveKey(pass, saltB64) {
  const base = await crypto.subtle.importKey('raw', utf8(pass), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64Bytes(saltB64), iterations: 250000, hash: 'SHA-256' }, base, 256));
}
async function aesKey() { if (!SYNC.key) SYNC.key = await crypto.subtle.importKey('raw', b64Bytes(SYNC.cfg.keyB64), 'AES-GCM', false, ['encrypt', 'decrypt']); return SYNC.key; }
async function seal(bytes) {
  if (!SYNC.cfg.keyB64) return bytes;
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(), bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function unseal(bytes) {
  if (!SYNC.cfg.keyB64) return bytes;
  try { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, await aesKey(), bytes.subarray(12))); }
  catch (e) { throw syncErr('badkey', 'decrypt'); }
}
const putBytes = async b => (await gh('/git/blobs', { method: 'POST', body: { content: bytesB64(await seal(b)), encoding: 'base64' } })).sha;
const getBytes = async sha => unseal(await gh(`/git/blobs/${sha}`, { raw: true }));
function hashStr(s) {
  let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (b >>> 0).toString(16).padStart(8, '0') + (a >>> 0).toString(16).padStart(8, '0') + s.length.toString(36);
}

/* ---------- three-way merge ---------- */
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const idArr = a => Array.isArray(a) && a.length > 0 && a.every(x => isObj(x) && x.id != null);
function same(a, b) {
  if (a === b || (a == null && b == null)) return true;
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return false;
    if (idArr(a) && idArr(b)) { const m = new Map(b.map(x => [x.id, x])); return a.every(x => m.has(x.id) && same(x, m.get(x.id))); }
    return a.every((x, i) => same(x, b[i]));
  }
  if (isObj(a) && isObj(b)) {
    const ka = Object.keys(a).filter(k => a[k] != null), kb = Object.keys(b).filter(k => b[k] != null);
    return ka.length === kb.length && ka.every(k => same(a[k], b[k]));
  }
  return false;
}
function merge3(b, l, r, lNewer) {
  if (same(l, r)) return l;
  if (same(b, l)) return r;
  if (same(b, r)) return l;
  const arrs = [b, l, r].filter(Array.isArray);
  if (Array.isArray(l) && Array.isArray(r)) {
    const keyed = arrs.every(a => a.length === 0 || idArr(a));
    if (keyed) {
      const bm = new Map((b || []).map(x => [x.id, x])), lm = new Map(l.map(x => [x.id, x])), rm = new Map(r.map(x => [x.id, x]));
      const out = [];
      [...lm.keys(), ...[...rm.keys()].filter(k => !lm.has(k)), ...[...bm.keys()].filter(k => !lm.has(k) && !rm.has(k))].forEach(k => {
        const bx = bm.get(k), lx = lm.get(k), rx = rm.get(k);
        if (!lx && !rx) return;
        if (!lx) { if (!bx || (!same(bx, rx) && !lNewer)) out.push(rx); return; } /* deleted here: stays deleted unless the other side's later edit wins */
        if (!rx) { if (!bx || (!same(bx, lx) && lNewer)) out.push(lx); return; }
        out.push(merge3(bx, lx, rx, lNewer));
      });
      return out;
    }
    if (arrs.every(a => a.every(x => !isObj(x)))) { /* sets of plain values: keep additions from both, honour removals from both */
      const bs = new Set(b || []), ls = new Set(l), rs = new Set(r);
      return [...new Set([...l, ...r])].filter(x => !(bs.has(x) && (!ls.has(x) || !rs.has(x))));
    }
    return lNewer ? l : r;
  }
  if (isObj(l) && isObj(r)) {
    const out = {}; const bo = isObj(b) ? b : {};
    new Set([...Object.keys(l), ...Object.keys(r)]).forEach(k => { const v = merge3(bo[k], l[k], r[k], lNewer); if (v !== undefined) out[k] = v; });
    return out;
  }
  return lNewer ? l : r;
}
/* a series should never hold two rows for one day; a done copy wins */
function dedupeSeries(rows) {
  const seen = new Map(), drop = new Set();
  rows.forEach(t => {
    if (!t.seriesId) return;
    const k = t.seriesId + '@' + t.date, f = seen.get(k);
    if (!f) { seen.set(k, t); return; }
    if (t.done && !f.done) { drop.add(f.id); seen.set(k, t); } else drop.add(t.id);
  });
  return drop.size ? rows.filter(t => !drop.has(t.id)) : rows;
}

/* ---------- notebook <-> cloud document: heavy images are kept out as content-addressed blobs ---------- */

const emptyBase = () => ({ commit: null, treeSha: null, tree: {}, files: {} });

async function syncOnce() {

    let remote = await readRemote(base);
    if (remote.empty) { await bootstrapRepo(); remote = await readRemote(base); }
    const stamp = D.meta.editedAt || 0;
    const L = toDoc(D);
    const hasR = remote.files['core.json'] !== undefined;
    const R = hasR ? fromFiles(remote.files) : emptyDoc();
    const B = base.files['core.json'] !== undefined ? fromFiles(base.files) : emptyDoc();

/* ---------- connect / disconnect ---------- */
async function syncConnect({ repoPath, token, pass, api }) {

  if (!m) throw syncErr('input', 'آدرس مخزن باید این شکلی باشه: نام‌کاربری/اسم‌مخزن');
  const prev = SYNC.cfg;
  clearTimeout(SYNC.timer);
  if (SYNC.run) await SYNC.run;
  const cfg = { id: 'syncCfg', owner: m[1], repo: m[2], token: String(token).trim(), api: api || null, branch: 'main', keyB64: null, marker: null };
  SYNC.connecting = true;
  SYNC.cfg = cfg; SYNC.key = null;
  try {
    const info = await gh('');
    if (!info.private) throw syncErr('public', 'این مخزن عمومیه. برای داده‌های شخصی فقط مخزن خصوصی قبول می‌کنم.');
    if (info.permissions && info.permissions.push === false) throw syncErr('denied', SYNC_MSG.denied);
    cfg.branch = info.default_branch || 'main';
    let base = Object.assign(emptyBase(), { id: 'syncBase' });
    /* the marker is plain text and tells us about the key; the document can only be read after that */
    let remote = await readRemote(base, true);
    if (remote.empty) { await bootstrapRepo(); remote = await readRemote(base, true); }
    let marker = null;
    if (remote.tree['hp.json']) marker = JSON.parse(unutf8(await gh(`/git/blobs/${remote.tree['hp.json']}`, { raw: true })));
    const hasDocFiles = remote.tree['core.json'] !== undefined;

      if (!pass) throw syncErr('needpass', 'داده‌های این مخزن رمز دارن. رمزش رو هم بنویس.');
      cfg.keyB64 = bytesB64(await deriveKey(pass, marker.salt));
      await unseal(b64Bytes(marker.check));
    } else if (!marker && pass) {
      if (hasDocFiles) throw syncErr('input', 'این مخزن از قبل بدون رمز داده داره؛ برای رمز گذاشتن یه مخزن خالی بساز.');
      const salt = bytesB64(crypto.getRandomValues(new Uint8Array(16)));

    if (hasRemote && !localEmpty) {
      const R = fromFiles(remote.files), last = lastActivity(R);
      const pick = await askChoice('هم این دستگاه داده داره، هم ابر', `تو ابر ${fa(R.dailyTasks.length)} تسک هست و آخرین فعالیتش ${last ? jMid(last) : 'نامعلوم'} بوده. تو این دستگاه ${fa(D.dailyTasks.length)} تسک هست. کدوم بمونه؟ اون یکی جایگزین می‌شه.`, [{ label: 'بی‌خیال', val: null, cls: 'ghost' }, { label: 'نگه داشتن این دستگاه', val: 'local' }, { label: 'نگه داشتن ابر', val: 'cloud', cls: 'pri' }]);
      if (!pick) throw syncErr('cancel', '');
      if (pick === 'local') base = Object.assign(base, { commit: remote.head, treeSha: remote.treeSha, tree: remote.tree, files: remote.files });
      else {
        await txp('snaps', 'readwrite', s => s.put({ id: 'day-before-cloud-' + Date.now(), kind: 'import', savedAt: Date.now(), data: D }));
        const R2 = fromFiles(remote.files); delete R2.pushedAt;

/* The newest day the person actually did something in this data, so a stale source is obvious before it replaces anything */
function lastActivity(raw) {
  const today = dateToStr(new Date(nowMs())); let best = '';
  const see = d => { const s = String(d || '').slice(0, 10); if (isDate(s) && s <= today && s > best) best = s; };
  (raw.dailyNotes || []).forEach(n => n && see(n.date));
  (raw.dailyTasks || []).forEach(t => { if (t && t.done) see(t.date); });
  allSkillsRaw(raw).forEach(p => (p.timeLogs || []).forEach(l => l && see(l.date)));
  return best;
}
function backupSummary(raw, nFiles, legacy) {

  const stale = last ? daysBetween(last, dateToStr(new Date(nowMs()))) : null;

}

}
A['welcome.cloud'] = () => { ui.welcome = false; commit(false); go('book'); };
A['welcome.empty'] = () => { ui.welcome = false; commit(true); toast('از «مهارت‌ها» اولین حوزه‌ات رو بساز.', 'ok', 5000); };
const _render = render;
render = function () { if (ui.welcome) { $('#page').innerHTML = welcomeHtml(); paintTabs(); paintMast(); AFTER.book && legacyAvailable().then(y => { const b = $('#legacyBox'); if (y && b) b.innerHTML = `<div class="notice calm">${icon('box')}<span class="grow">یه نسخه‌ی قبلی پلنر تو این مرورگر هست؛ ممکنه قدیمی باشه.</span><button type="button" class="btn sm" data-a="legacy.import">بررسیش کن</button></div>`; }); return; } _render(); };
function fatalScreen(rawRec, err) {
  S.readOnly = true;
  document.getElementById('page').innerHTML = `<div class="fatal stack"><h1 class="page-title">دفتر باز نشد</h1><p><b>هیچی پاک نشده.</b> تا وقتی این مشکل حل نشه چیزی روی دفتر نوشته نمی‌شه.</p><p class="small muted ltr">${esc(err && err.message || err || '')}</p><div class="row wrap"><button type="button" class="btn pri" onclick="location.reload()">دوباره امتحان کن</button>${rawRec ? '<button type="button" class="btn" id="dlRaw">دانلود داده‌ی خام</button>' : ''}</div></div>`;
  const b = document.getElementById('dlRaw'); if (b) b.onclick = () => downloadBlob(new Blob([JSON.stringify(rawRec)], { type: 'application/json' }), 'homoplanner-raw.json');
}
(async function boot() {
  let rec = null;
  try { await idb(); rec = await txp('kv', 'readonly', s => s.get('main')); }
  catch (e) { console.error(e); fatalScreen(null, e); return; }
  if (rec) {
    try {
      const { data, dropped } = sanitizeData(rec.data);
      D = data; S.rev = rec.rev;
      if (dropped.length) setTimeout(() => toast(`${fa(dropped.length)} ردیف خراب پیدا شد و کنار گذاشته شد؛ بقیه‌ی دفتر سالمه.`, 'err', 9000), 300);
    } catch (e) { console.error(e); fatalScreen(rec, e); return; }
  } else ui.welcome = true;
  applyTheme();
  S.loaded = true;
  bootLogic();
  if (rec) { S.dirty = true; flushSave(); }
  await syncLoadCfg();
  applyRoute();
  syncBoot();
  if (D.timer.running && timerSecs() > 8 * 3600) toast(`کرونومتر ${fmtMin(Math.round(timerSecs() / 60))} روشن مونده. اگه یادت رفته، ریستش کن.`, 'err', 9000);
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { /* browser may refuse */ }
  if (/^https?:/.test(location.protocol) && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
    if (!$('link[rel=manifest]')) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.append(l); }
  }
})();
